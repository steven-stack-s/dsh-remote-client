name: 构建 Windows 安装包

# 为什么用 CI 构建而不是本地构建：
#   1. 在 Windows runner 上原生构建，避免 Linux 交叉构建时的 wine 依赖与
#      二进制工具下载超时问题；
#   2. 你（维护者）也无需在本地安装 Node / pnpm / 构建工具链；
#   3. 产物直接挂到 GitHub Release，最终用户点开就能下载安装。
#
# 最终用户拿到的 setup.exe 自带完整 Electron 运行时，
# **不需要安装 Node、pnpm 或任何运行环境**。

on:
  push:
    # 推 main 自动构建，但**只产出 Artifacts、不创建 Release**。
    # 用途：维护者处于「反复测试完善」阶段时，每次推代码都能直接拿到新包，
    # 不必去 Actions 页面手动点 Run workflow。
    branches:
      - main
    # 打 tag 才发布（如 git tag v0.1.0 && git push origin v0.1.0）。
    # 只有这一步会创建 GitHub Release，普通的 main 推送不会。
    tags:
      - 'v*'
  # 仍保留手动触发，便于对任意分支试构建
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与测试
        run: |
          pnpm typecheck
          pnpm test

      - name: 构建安装包
        id: build
        shell: bash
        run: |
          set -o pipefail
          pnpm dist:win 2>&1 | tee build.log

      # 构建失败时把原因暴露到「无需认证即可读取」的地方。
      #
      # 背景：GitHub 的 job 日志下载接口需要认证（匿名请求 403），
      # 而 annotations 匿名可读。所以这里把错误摘要写成 annotation，
      # 让维护者（或协助排查的人）不必翻网页日志就能看到原因。
      - name: 构建失败诊断
        if: failure()
        shell: bash
        run: |
          echo "===== build.log 末尾 60 行 ====="
          tail -60 build.log 2>&1 || echo "(无 build.log)"
          echo
          echo "===== release 目录 ====="
          ls -la release/ 2>&1 || echo "(release 不存在)"
          echo
          echo "===== builder-debug.yml（实际生效的配置）====="
          cat release/builder-debug.yml 2>&1 || echo "(无)"
          echo
          echo "===== 环境 ====="
          node -v; pnpm -v
          echo
          echo "===== electron 二进制 ====="
          ls node_modules/electron/dist 2>&1 | head -8 || echo "(electron/dist 缺失)"

          # 摘要写进 annotation（匿名可读）与 job summary（网页可见）。
          SUMMARY="$(tail -40 build.log 2>/dev/null | tr '\n' '\r' | tr -d '%')"
          echo "::error title=CI 构建失败（build.log 末尾）::${SUMMARY}"
          {
            echo "## CI 构建失败"
            echo '```'
            tail -60 build.log 2>&1 || echo "(无 build.log)"
            echo '```'
            echo "### builder-debug.yml"
            echo '```yaml'
            cat release/builder-debug.yml 2>&1 || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 收集产物信息
        id: artifact
        shell: bash
        run: |
          ls -la release/
          setup="$(ls release/*.exe | head -1)"
          echo "setup=$setup" >> "$GITHUB_OUTPUT"
          # 校验值：安装包未做代码签名，浏览器/系统会给「未知来源」警告，
          # 下载者无从判断拿到的文件是否完整、是否被替换过。给出 SHA256
          # 至少让「我下到的就是 CI 产出的那一份」可被自行核对。
          sha="$(sha256sum "$setup" | cut -d' ' -f1)"
          size="$(stat -c%s "$setup")"
          name="$(basename "$setup")"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          {
            echo "### 安装包校验值"
            echo
            echo '```'
            echo "文件   $name"
            echo "大小   $size 字节"
            echo "SHA256 $sha"
            echo '```'
            echo
            echo "核对（PowerShell）："
            echo
            echo '```powershell'
            echo "Get-FileHash .\\$name -Algorithm SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物（在 Actions 页面该次运行的 Artifacts 区下载）
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # 三样都要传：exe 是给用户的安装包，latest.yml 与 .blockmap 是更新器
          # 用的元数据——只在 Artifacts 里少了它们，差分更新会在下一版发布时
          # 静默退化成全量下载（或直接发现不了新版）。
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          # 安装包约 106MB，且 main 每次推送都会产出。设自动过期避免
          # 无限累积占用仓库的 Artifacts 配额；够取用即可。
          retention-days: 7

      # Release 正文的来源：CHANGELOG.md 里该版本的 `### Highlights` 小节。
      # 单独一步生成，是为了让「抽不到 Highlights」在日志里明确报警，
      # 而不是悄悄发出一页没有版本信息的 Release（脚本细节见其文件头）。
      - name: 生成 Release 正文（取 CHANGELOG 的 Highlights）
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          # 版本号取自 tag（refs/tags/v0.2.5 → 0.2.5）；版本号的唯一来源是 package.json，
          # 这里用 tag 与之匹配，两者不一致时抽不到 Highlights 会在日志报警。
          VERSION="${GITHUB_REF_NAME#v}"
          echo "tag: $GITHUB_REF_NAME → 版本: $VERSION"
          # 正文落在 release/（已被 .gitignore 排除的构建产物区），
          # 避免在仓库根留下一个未跟踪文件。
          node scripts/extract-highlights.mjs "$VERSION" --out release/release-notes.md

          # SHA256 与体积：安装包未做签名，下载者无从判断拿到的文件是否完整、
          # 是否被替换过。给出这两项至少让「我下到的就是 CI 产出的那一份」可被自行核对。
          # 这部分由 CI 实测值渲染，不能写进 CHANGELOG（那是人工维护的文本）。
          {
            echo
            echo '---'
            echo
            echo '### 文件校验'
            echo
            echo '```'
            echo "文件   ${{ steps.artifact.outputs.name }}"
            echo "大小   ${{ steps.artifact.outputs.size }} 字节"
            echo "SHA256 ${{ steps.artifact.outputs.sha256 }}"
            echo '```'
            echo
            echo '下载后建议核对（PowerShell）：'
            echo
            echo '```powershell'
            echo 'Get-FileHash .\DSH*setup.exe -Algorithm SHA256'
            echo '```'
            echo
            echo '输出应与上面的 SHA256 一致。校验 SHA256 比 SmartScreen 的「未知发布者」'
            echo '提示更可靠——安装包未做代码签名，那类提示是未签名 + 下载量少触发的信誉'
            echo '警告，不是文件损坏（Chrome 选「保留」；Edge 选「更多信息」→「仍要运行」）。'
          } >> release/release-notes.md

          echo "===== release-notes.md ====="
          cat release/release-notes.md

      - name: 发布到 GitHub Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 与 Artifacts 同步：三样齐全，更新器才拿得到版本清单与块索引。
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          # 提交列表附在正文之后，便于想深挖的人展开。
          generate_release_notes: true
          body_path: release/release-notes.md
