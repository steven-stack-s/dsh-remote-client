# electron-builder 打包配置
#
# 目标：产出一个 Windows 安装包，最终用户双击安装即可用，
# **无需安装 Node、pnpm 或任何运行环境**——Electron 运行时被打进安装包。
#
# 构建前置：先跑 `pnpm build`（electron-vite 产出 out/），再跑 `pnpm dist:win`。

appId: com.stevenstack.dshremoteclient
productName: DSH Remote Client
copyright: MIT Licensed

# 差分更新的元数据来源：声明之后，构建会额外产出 latest.yml（版本清单）
# 与 *.exe.blockmap（块索引）。更新器靠前者判断有没有新版，靠后者算出要下哪几块。
#
# ⚠️ 加了这一段之后，CI 里的 `electron-builder` **必须继续带 `--publish never`**
#    （现有命令已经是），否则它会自己往 Release 推一份，与 action-gh-release 打架。
publish:
  provider: github
  owner: steven-stack-s
  repo: dsh-remote-client

directories:
  buildResources: build
  output: release

# 只打包构建产物。dependencies 为空（electron-vite 已把主进程与 preload
# 打成单文件，electron 本身由运行时提供），所以无需收集 node_modules。
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# 把代码收进 asar，避免最终用户误改，也更快。
asar: true

# 本项目 dependencies 为空（主进程与 preload 已被 electron-vite 打成单文件，
# electron 由运行时提供），**没有任何原生模块需要针对 Electron ABI 重建**。
# 显式关掉可跳过 @electron/rebuild 流程：省时间，也避免在 Windows 上
# 因缺少编译工具链而失败。
npmRebuild: false

win:
  # electron-builder 会从这张 256×256 PNG 自动生成多尺寸 .ico
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # 未签名：最终用户首次运行会看到 SmartScreen 警告（见 README「安装与分发」）。
  # 若要消除，需配置证书：在配置里补 certificateFile / certificatePassword。
  #
  # ⚠️ **这个名字必须不含空格，否则自动更新必然 404。**
  #
  # 不能写 `${productName}`：`productName` 是 `DSH Remote Client`（含空格），而空格
  # 在三个地方被三种规则改写，最后三方各不相同：
  #   1. 磁盘文件名 —— 保持原样：`DSH Remote Client-0.1.7-setup.exe`
  #   2. latest.yml 的 url —— electron-builder 的 `computeSafeArtifactNameIfNeeded`
  #      见名字不是「GitHub 安全」就把空格换成连字符：
  #      `DSH-Remote-Client-0.1.7-setup.exe`
  #   3. GitHub 附件名 —— 上传时 GitHub 自己把空格换成点：
  #      `DSH.Remote.Client-0.1.7-setup.exe`
  # 更新器按 (2) 去下载，而 Release 里只有 (3) → **404，更新永远失败**。
  # 这个缺陷本地测试与 CI 都发现不了（都不会真去下载更新包），只在真机暴露，
  # v0.1.7 首次发布时才由人工核对 `latest.yml` 与附件名抓出来。
  #
  # 显式写成不含空格的形式后，`isSafeGithubName` 直接通过，
  # `computeSafeArtifactNameIfNeeded` 返回 null、不再改写，于是
  # 「磁盘名 = latest.yml 里的 url = GitHub 附件名」三者必然一致。
  # 点号形式是刻意选的：它正是 GitHub 过去对含空格名字改写后的样子，
  # 用户已经见过，且与历史版本的下载名保持连续。
  artifactName: DSH.Remote.Client-${version}-setup.${ext}

nsis:
  # 面向最终用户的安装体验：
  #   oneClick: false → 给出安装向导而非静默安装（用户能看到在做什么）
  #   perMachine: false → 装到当前用户目录，**不需要管理员权限**
  #   allowToChangeInstallationDirectory → 可自选安装位置
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Remote Client
  # 卸载时保留用户数据（hosts.json 里的主机配置与各主机的登录态），
  # 重装后无需重新配置。这与「登录态长期保持」的承诺一致。
  deleteAppDataOnUninstall: false
  # 中文安装界面
  installerLanguages:
    - zh_CN
    - en_US
  language: '2052'
