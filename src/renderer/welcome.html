<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>添加 dsh 主机</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-content: center;
        background: #151517; color: #e6edf3;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      form { width: 420px; display: grid; gap: 10px; }
      h1 { font-size: 16px; margin: 0 0 6px; }
      label { font-size: 13px; color: #8b949e; }
      input {
        padding: 9px 12px; font-size: 14px; border-radius: 8px;
        border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
      }
      button {
        margin-top: 8px; padding: 10px; font-size: 14px; border: 0;
        border-radius: 8px; background: #4c8bf5; color: #fff; cursor: pointer;
      }
      p.err { color: #f85149; font-size: 13px; min-height: 18px; margin: 0; }
      p.hint { color: #8b949e; font-size: 12px; line-height: 1.7; margin: 0; }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>添加 dsh 主机</h1>
      <label for="origin">主机地址</label>
      <input id="origin" placeholder="http://192.168.1.5:3080" autocomplete="off" required />
      <label for="label">显示名（可选）</label>
      <input id="label" placeholder="家里 NAS" autocomplete="off" />
      <button type="submit">添加并打开</button>
      <p class="err" id="err"></p>
      <p class="hint">远端需已配置 <code>DSH_TRUSTED_HOSTS</code>，或已安装 <code>@xgone/dsh-remote</code>，否则登录后会遇到 403。</p>
    </form>
    <script>
      const form = document.getElementById('form')
      const err = document.getElementById('err')
      form.addEventListener('submit', async event => {
        event.preventDefault()
        err.textContent = ''
        const origin = document.getElementById('origin').value
        const label = document.getElementById('label').value
        const result = await window.shell.addHost({ origin, label: label === '' ? undefined : label })
        if (!result.ok) err.textContent = result.message
      })
    </script>
  </body>
</html>
