<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>无法连接到 dsh 主机</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-content: center; gap: 12px;
        background: #151517; color: #e6edf3; text-align: center;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      h1 { font-size: 18px; margin: 0; }
      p { margin: 0; color: #8b949e; font-size: 14px; line-height: 1.7; }
      code { color: #4c8bf5; }
    </style>
  </head>
  <body>
    <h1>无法连接到 dsh 主机</h1>
    <p id="detail">正在重试…</p>
    <p>若提示 403，请在 dsh-docker 侧配置 <code>DSH_TRUSTED_HOSTS</code>，或安装 <code>@xgone/dsh-remote</code>。</p>
    <script>
      const params = new URLSearchParams(location.search)
      document.getElementById('detail').textContent = params.get('detail') ?? '正在重试…'
    </script>
  </body>
</html>
